name: 下载JM本子 (dispatch)

on:
  workflow_dispatch:
    inputs:
      JM_ALBUM_IDS:
        type: string
        description: 本子id（多个id用-隔开，如 '123-456-789'）
        required: false

      JM_PHOTO_IDS:
        type: string
        description: 章节id（单独下载章节，多个id同上）
        required: false

      CLIENT_IMPL:
        type: string
        description: 客户端类型（client.impl），下载失败时，你可以尝试填入此项重试。'api' 表示移动端，'html' 表示网页端。
        default: ''
        required: false

      IMAGE_SUFFIX:
        type: string
        description: 图片后缀（download.cache.suffix），默认为空，表示不做图片格式转换。可填入例如 'png' 'jpg'
        default: ''
        required: false

      IMAGE_QUALITY:
        type: number
        description: 图片质量（1-99开启；100不压缩。此配置不支持后缀=PNG的图片。pdf模式会把图片转为JPEG压缩再合并pdf）
        default: 100
        required: false

      DIR_RULE:
        type: string
        description: 下载文件夹规则（dir_rule.rule）。默认使用配置文件的 'Bd_Aauthor_Atitle_Pindex'。
        default: ''
        required: false

      PDF_OPTION:
        description: '下载后的导出方式（默认每个章节合并为一张 PNG 长图）'
        required: false
        type: choice
        default: 是 | 章节维度合并长图
        options:
          - 是 | 章节维度合并长图
          - 否
          - 是 | 本子维度合并pdf
          - 是 | 章节维度合并pdf

      PDF_NAME_RULE:
        type: string
        description: 'PDF文件命名规则。支持字段如 Aid, Atitle, Pindex, Pid, Ptitle'
        default: ''
        required: false

      UPLOAD_NAME:
        type: string
        default: Click me to download
        description: 下载 ZIP 的名称（无需填写 .zip 后缀）
        required: false

#      JM_USERNAME:
#        type: string
#        default: ''
#        description: '禁漫帐号（不建议使用，用户名和密码会泄露在日志中。最好用secrets）'
#        required: false
#
#      JM_PASSWORD:
#        type: string
#        default: ''
#        description: '禁漫密码（不建议使用，用户名和密码会泄露在日志中。最好用secrets）'
#        required: false


jobs:
  crawler:
    runs-on: ubuntu-latest
    env:
      # 工作流输入
      JM_ALBUM_IDS: ${{ github.event.inputs.JM_ALBUM_IDS }}
      JM_PHOTO_IDS: ${{ github.event.inputs.JM_PHOTO_IDS }}
      DIR_RULE: ${{ github.event.inputs.DIR_RULE }}
      CLIENT_IMPL: ${{ github.event.inputs.CLIENT_IMPL }}
      UPLOAD_NAME: ${{ github.event.inputs.UPLOAD_NAME }}
      IMAGE_SUFFIX: ${{ github.event.inputs.IMAGE_SUFFIX }}
      IMAGE_QUALITY: ${{ github.event.inputs.IMAGE_QUALITY }}
      PDF_OPTION: ${{ github.event.inputs.PDF_OPTION }}
      PDF_NAME_RULE: ${{ github.event.inputs.PDF_NAME_RULE }}

      # 登录相关secrets
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}

      # 邮件相关secrets
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TITLE: ${{ secrets.EMAIL_TITLE }}
      EMAIL_CONTENT: ${{ secrets.EMAIL_CONTENT }}

      # 固定值
      JM_DOWNLOAD_DIR: /home/runner/work/jmcomic/download/

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-dev.txt

      - name: Install img2pdf
        if: contains(inputs.PDF_OPTION, 'pdf')
        run: |
          pip install img2pdf

      - name: 安装jmcomic（local）
        run: |
          pip install -e ./

      - name: 运行下载脚本
        run: |
          cd ./usage/
          python workflow_download.py

      - name: 检查下载结果
        id: check_download
        run: |
          if [ ! -d "$JM_DOWNLOAD_DIR" ] || [ -z "$(ls -A "$JM_DOWNLOAD_DIR")" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "下载目录不存在或为空，跳过上传"
            exit 0
          fi
          echo "has_files=true" >> $GITHUB_OUTPUT

      - name: 上传结果
        if: steps.check_download.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOAD_NAME }}
          # GitHub 会直接将目录内容打包为 ZIP。
          path: ${{ env.JM_DOWNLOAD_DIR }}
          if-no-files-found: warn
          retention-days: 90
